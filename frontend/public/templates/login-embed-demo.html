<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk ke Akun — Financier & Catauth Gateway</title>
  
  <!-- Modern Typography (Google Fonts Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />

  <!-- Catauth Universal JavaScript SDK -->
  <script src="https://catauth.vercel.app/sdk/catauth.js"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --card-bg: rgba(18, 18, 24, 0.85);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary-cyan: #06b6d4;
      --primary-cyan-glow: rgba(6, 182, 212, 0.25);
      --accent-emerald: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: absolute;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.12) 0%, rgba(0, 0, 0, 0) 70%);
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: none;
      z-index: 0;
    }

    .ambient-glow-bottom {
      position: absolute;
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.08) 0%, rgba(0, 0, 0, 0) 70%);
      bottom: -150px;
      right: -100px;
      pointer-events: none;
      z-index: 0;
    }

    /* Container Card */
    .login-card {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 36px 32px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.03);
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Header & Branding */
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-icon {
      width: 52px;
      height: 52px;
      margin: 0 auto 16px;
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(6, 182, 212, 0.3);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--primary-cyan-glow);
    }

    .brand-icon svg {
      width: 26px;
      height: 26px;
      stroke: var(--primary-cyan);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: #fff;
      margin-bottom: 6px;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    /* NFC Fast Login Section */
    .nfc-auth-section {
      background: rgba(6, 182, 212, 0.04);
      border: 1px solid rgba(6, 182, 212, 0.2);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .nfc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 700;
      color: var(--primary-cyan);
      background: rgba(6, 182, 212, 0.12);
      padding: 3px 8px;
      border-radius: 6px;
      margin-bottom: 10px;
      font-family: 'JetBrains Mono', monospace;
    }

    .btn-nfc-tap {
      width: 100%;
      background: linear-gradient(135deg, #0891b2 0%, #06b6d4 100%);
      color: #000;
      font-weight: 700;
      font-size: 14px;
      padding: 13px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px var(--primary-cyan-glow);
    }

    .btn-nfc-tap:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
      background: linear-gradient(135deg, #06b6d4 0%, #22d3ee 100%);
    }

    .btn-nfc-tap:active {
      transform: translateY(0);
    }

    .btn-nfc-tap svg {
      width: 20px;
      height: 20px;
    }

    .nfc-hint {
      font-size: 11px;
      color: #64748b;
      text-align: center;
      margin-top: 8px;
    }

    /* Divider */
    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #475569;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
    }

    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .divider span {
      padding: 0 12px;
    }

    /* Form Fields */
    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 6px;
    }

    .input-wrapper {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.15);
      background: rgba(15, 23, 42, 0.9);
    }

    .form-input::placeholder {
      color: #475569;
    }

    /* Submit Button */
    .btn-submit {
      width: 100%;
      background: #f8fafc;
      color: #0f172a;
      font-weight: 700;
      font-size: 14px;
      padding: 12px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    /* Status & Alerts */
    .status-alert {
      display: none;
      padding: 12px 14px;
      border-radius: 10px;
      font-size: 12px;
      margin-bottom: 18px;
      line-height: 1.4;
      animation: fadeIn 0.2s ease;
    }

    .status-alert.success {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .status-alert.error {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    /* Footer Info */
    .footer-note {
      margin-top: 24px;
      text-align: center;
      font-size: 11px;
      color: #475569;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .footer-note svg {
      width: 13px;
      height: 13px;
      stroke: var(--accent-emerald);
    }
  </style>
</head>
<body>

  <div class="ambient-glow"></div>
  <div class="ambient-glow-bottom"></div>

  <div class="login-card">
    
    <!-- Branding Header -->
    <div class="brand-header">
      <div class="brand-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11c0 3.517-1.009 6.799-2.753 9.571m-3.44-2.04l.054-.09A13.916 13.916 0 008 11a4 4 0 118 0c0 1.017-.07 2.019-.203 3m-2.118 6.844A21.88 21.88 0 0015.171 17m3.839 1.132c.645-2.266.99-4.659.99-7.132A8 8 0 004.07 9m1.94 10.377A14.935 14.935 0 014 11" />
        </svg>
      </div>
      <h1 class="brand-title">Financier Portal</h1>
      <p class="brand-subtitle">Silakan masuk menggunakan Kunci Hardware NFC atau Akun Anda</p>
    </div>

    <!-- Live Status Alert Box -->
    <div id="status-box" class="status-alert"></div>

    <!-- 🌟 BAGIAN 1: Login Cepat Kartu NFC Catauth -->
    <div class="nfc-auth-section">
      <div class="nfc-badge">
        <span>⚡ 1-TAP NFC LOGIN</span>
      </div>
      
      <button id="btn-nfc-login" class="btn-nfc-tap" type="button">
        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
        </svg>
        <span>Tempelkan Kartu NFC Fisik</span>
      </button>
      
      <p class="nfc-hint">e-Money / Flazz / e-KTP / YubiKey di belakang HP</p>
    </div>

    <div class="divider">
      <span>ATAU MASUK MANUAL</span>
    </div>

    <!-- 🔑 BAGIAN 2: Form Login Password Biasa -->
    <form id="form-login-manual">
      <div class="form-group">
        <label class="form-label" for="email">Alamat Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="form-input" placeholder="nama@email.com" required />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Kata Sandi</label>
        <div class="input-wrapper">
          <input type="password" id="password" class="form-input" placeholder="••••••••" required />
        </div>
      </div>

      <button type="submit" class="btn-submit">
        Masuk dengan Kata Sandi
      </button>
    </form>

    <div class="footer-note">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
      </svg>
      <span>Dilindungi oleh Catauth Zero-Trust Hardware Vault</span>
    </div>

  </div>

  <!-- SCRIPT LOGIKA LOGIN -->
  <script>
    const statusBox = document.getElementById('status-box');
    const btnNfcLogin = document.getElementById('btn-nfc-login');
    const formLoginManual = document.getElementById('form-login-manual');

    function showStatus(message, type = 'success') {
      statusBox.className = `status-alert ${type}`;
      statusBox.innerHTML = `
        <svg style="width: 18px; height: 18px; shrink: 0;" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          ${type === 'success' 
            ? '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />' 
            : '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />'}
        </svg>
        <span>${message}</span>
      `;
      statusBox.style.display = 'flex';
    }

    // 🎯 1. INISIALISASI TOMBOL LOGIN NFC CATAUTH
    btnNfcLogin.addEventListener('click', async () => {
      btnNfcLogin.disabled = true;
      btnNfcLogin.innerHTML = '<span>📲 Membaca sensor NFC...</span>';
      showStatus('Silakan tempelkan kartu fisik Anda ke belakang HP...', 'success');

      try {
        await Catauth.loginWithNFC({
          linkId: 'lnk_alpha_portal', // Ganti dengan ID Protected Link Anda dari dashboard Catauth
          onSuccess: (authData) => {
            console.log('Otentikasi Berhasil!', authData);
            
            const user = authData.user;
            showStatus(`✅ Selamat datang, ${user.name}! Mengalihkan ke dashboard...`, 'success');

            // 💾 Simpan Sesi Pengguna di Website Anda
            localStorage.setItem('currentUser', JSON.stringify(user));
            localStorage.setItem('userEmail', user.email);
            localStorage.setItem('userRole', user.role);
            localStorage.setItem('catauthToken', authData.auth_token);

            // 🚀 Buka Dashboard Website Anda
            setTimeout(() => {
              window.location.href = '/dashboard.html'; // Ganti dengan URL dashboard Anda
            }, 1200);
          },
          onError: (err) => {
            console.error('Login gagal:', err);
            showStatus(err.message || 'Gagal memverifikasi kartu.', 'error');
            btnNfcLogin.disabled = false;
            btnNfcLogin.innerHTML = `
              <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" style="width:20px;height:20px;">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z" />
              </svg>
              <span>Coba Tempelkan Lagi</span>
            `;
          }
        });
      } catch (e) {
        showStatus('Perangkat atau browser tidak mendukung Web NFC langsung.', 'error');
        btnNfcLogin.disabled = false;
      }
    });

    // 🎯 2. LOGIN FORM PASSWORD BIASA
    formLoginManual.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      showStatus(`Masuk dengan akun ${email}...`, 'success');
      
      // Simpan session & redirect
      localStorage.setItem('currentUser', JSON.stringify({ email, name: email.split('@')[0] }));
      setTimeout(() => {
        window.location.href = '/dashboard.html';
      }, 1000);
    });
  </script>

</body>
</html>
